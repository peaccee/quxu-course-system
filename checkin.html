<!doctype html>
<html lang="zh-Hant">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>續曲課務系統｜現場點名</title><link rel="stylesheet" href="./css/style.css"></head>
<body><header class="topbar"><div><strong>續曲課務系統</strong><span class="topbar-sub">現場點名</span></div><button class="button-secondary" id="logout">登出</button></header>
<main class="container"><section class="welcome"><p class="eyebrow">CHECK-IN</p><h1>課程點名</h1><p class="muted">請選擇課程與日期，再更新學員出席狀態。</p></section>
<section class="panel">
<label for="course-select">選擇課程</label><select id="course-select"><option value="">載入課程中…</option></select>
<label for="session-select">選擇上課日期</label><select id="session-select" disabled><option value="">請先選擇課程</option></select>
<div id="session-info" class="muted small"></div>
<div id="roster" class="roster"><p class="muted">選擇課程與日期後顯示點名名單。</p></div>
<p id="message" class="message" role="status"></p>
</section></main><script type="module" src="./js/checkin.js"></script></body></html>
